name: Deploy site to Pages

# The redesigned site is staged on `main` while `master` remains the default
# branch and continues to serve the live site. Deployment is therefore manual
# for now. At cutover, make `main` the default branch and add:
#
#   push:
#     branches: [main]
#
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:content -w @openwdl/brand
      - run: npm run test -w @openwdl/brand
      - run: OPENWDL_BASE=/ npm run build -w @openwdl/brand
      - run: OPENWDL_BASE=/ npm run test:static -w @openwdl/brand
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
